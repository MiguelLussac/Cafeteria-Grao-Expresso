openapi: 3.0.3
info:
  title: API de Pedidos - Cafeteria Grão Expresso
  description: |
    API RESTful do Sistema de Pedidos da Cafeteria Grão Expresso (Squad 50).
    Projetada conforme o Documento de Arquitetura de Solução (DAS).
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Servidor de Desenvolvimento Local
  - url: https://cafeteria-grao-expresso.onrender.com/api/v1
    description: Servidor de Produção (Render)

paths:
  /health:
    get:
      summary: Health Check da Aplicação
      responses:
        '200':
          description: Serviço saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "healthy" }
                  service: { type: string, example: "Cafeteria Grao Expresso API" }
                  version: { type: string, example: "1.0.0" }

  /auth/login:
    post:
      summary: Autenticação de Usuário (Equipe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "atendente" }
                password: { type: string, example: "atendente123" }
      responses:
        '200':
          description: Login bem-sucedido e retorno do token JWT
        '401':
          description: Credenciais inválidas

  /auth/me:
    get:
      summary: Retorna dados do usuário autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Informações do usuário logado

  /products:
    get:
      summary: Listar produtos do cardápio
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [bebidas, doces, salgados]
          description: Filtrar por categoria
        - in: query
          name: active_only
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Lista de produtos
    post:
      summary: Cadastrar novo produto no cardápio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, category]
              properties:
                name: { type: string, minLength: 1, maxLength: 120, example: "Café Expresso" }
                description: { type: string, example: "Café encorpado 50ml" }
                price: { type: number, format: float, minimum: 0, exclusiveMinimum: true, maximum: 99999999.99, multipleOf: 0.01, example: 6.50 }
                category: { type: string, enum: [bebidas, doces, salgados] }
      responses:
        '201':
          description: Produto criado com sucesso
        '400':
          description: Campos obrigatórios ausentes ou dados inválidos
        '401':
          description: Token ausente, inválido ou expirado
        '403':
          description: Papel sem permissão para cadastrar produtos
        '500':
          description: Falha ao persistir o produto

  /cadastrar-produto/:
    post:
      summary: Alias de compatibilidade para cadastrar produto
      description: Mantém o caminho previsto no quadro da sprint; o contrato principal é POST /products.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, category]
              properties:
                name: { type: string, minLength: 1, maxLength: 120, example: "Café Expresso" }
                description: { type: string, example: "Café encorpado 50ml" }
                price: { type: number, format: float, minimum: 0, exclusiveMinimum: true, maximum: 99999999.99, multipleOf: 0.01, example: 6.50 }
                category: { type: string, enum: [bebidas, doces, salgados] }
      responses:
        '201':
          description: Produto criado com sucesso
        '400':
          description: Campos obrigatórios ausentes ou dados inválidos
        '401':
          description: Token ausente, inválido ou expirado
        '403':
          description: Papel sem permissão para cadastrar produtos
        '500':
          description: Falha ao persistir o produto

  /products/{id}:
    get:
      summary: Buscar produto por ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Dados do produto
        '404':
          description: Produto não encontrado
    put:
      summary: Atualizar produto
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Produto atualizado
    delete:
      summary: Desativar produto
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Produto desativado

  /orders:
    get:
      summary: Listar pedidos
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [recebido, em_preparo, pronto, entregue, cancelado]
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Lista de pedidos
    post:
      summary: Criar um novo pedido (Totem ou Atendente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                customer_name: { type: string, example: "Mariana Silva" }
                table_number: { type: string, example: "Mesa 04" }
                notes: { type: string, example: "Sem açúcar" }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id]
                    properties:
                      product_id: { type: integer, example: 1 }
                      quantity: { type: integer, minimum: 1, default: 1, example: 2 }
      responses:
        '201':
          description: Pedido criado com sucesso

  /orders/kitchen:
    get:
      summary: Fila paga da cozinha com itens completos
      description: |
        Apenas pagamentos pagos e pedidos recebido/em_preparo/pronto.
        Ordena por paid_at crescente e id. Sem truncamento.
        Retorna success, count e data com os mesmos pedidos completos de GET /orders/{id}.
        id é o número do pedido; notes contém observações; items contém product_name e quantity.
        Consultar em toda conexão/reconexão SSE para recuperar o estado.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [recebido, em_preparo, pronto]
      responses:
        '200':
          description: Fila completa de pedidos liberados
        '400':
          description: Filtro inválido
        '401':
          description: JWT ausente, inválido ou expirado
        '403':
          description: Perfil diferente de barista, atendente ou admin

  /orders/{id}:
    get:
      summary: Consultar pedido por ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Detalhes do pedido com itens e status

  /orders/{id}/status:
    patch:
      summary: Atualizar status do pedido (Painel da Cozinha)
      description: |
        recebido -> em_preparo -> pronto -> entregue. Cancelamento de recebido ou em_preparo.
        Avanços exigem pagamento pago. Terminais não podem ser reabertos.
        Repetição, salto, retrocesso, conflito concorrente ou avanço sem pagamento retorna 409.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [recebido, em_preparo, pronto, entregue, cancelado]
      responses:
        '200':
          description: Status atualizado com sucesso
        '400':
          description: Status ou corpo inválido
        '409':
          description: Transição não permitida ou pedido ainda não pago

  /orders/{id}/payment:
    post:
      summary: Registrar pagamento simulado
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [dinheiro, cartao, pix]
                amount:
                  type: number
                  format: float
                  nullable: true
                  description: Omitido ou null utiliza o total; explícito deve ser finito, positivo e igual ao total.
                  example: 20.00
      responses:
        '201':
          description: Pagamento registrado com sucesso

    get:
      summary: Consultar pagamento simulado do pedido
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Envelope success/data com payment_id, order_id, method, amount, status e paid_at.
        '404':
          description: Pedido inexistente ou sem pagamento.

  /events/orders:
    get:
      summary: Stream Server-Sent Events (SSE) para atualização de pedidos
      description: |
        Público, preservando o contrato existente. new_order somente após pagamento persistido
        (order_id e pedido completo); order_status_updated e order_ready após mudanças persistidas.
        connected contém resync_required=true e state_url=/api/v1/orders/kitchen (consulta com JWT).
        Reconectar após 3000ms e recuperar estado pela API em toda conexão; não há replay de Last-Event-ID.
        Heartbeat ocioso a cada 15s. Fila saturada encerra o stream para reconexão e ressincronização.
      responses:
        '200':
          description: Conexão contínua de streaming SSE (text/event-stream)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
